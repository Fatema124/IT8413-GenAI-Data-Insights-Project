<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" width="1200" height="390" role="img" aria-labelledby="t d">
<title id="t">How PriceLens BH works</title>
<desc id="d">Three iGA datasets flow into the data pipeline (load.py, prepare.py, run.py), then into analytics.py, one set of calculations that feeds the dashboard (live), the model tools (built; the model itself, F4, comes next) and the report export (coming next).</desc>
