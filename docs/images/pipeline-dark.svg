  .bs { font-size: 13.5px; fill: #c3c2b7; }
  .gl { font-size: 12.5px; font-weight: 700; letter-spacing: 1.5px; fill: #898781; }
  .lg { font-size: 13px; fill: #c3c2b7; }
  .flow { fill: none; stroke: #3987e5; stroke-width: 2; stroke-dasharray: 7 6; animation: flow 1.4s linear infinite; }
  .todo { fill: none; stroke: #5c5b57; stroke-width: 2; stroke-dasharray: 3 6; }
  @keyframes flow { to { stroke-dashoffset: -13; } }
  @media (prefers-reduced-motion: reduce) { .flow { animation: none; } }
</style>
