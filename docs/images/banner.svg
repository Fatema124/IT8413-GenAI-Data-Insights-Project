<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="t d">
<title id="t">PriceLens BH</title>
<desc id="d">Cost-of-living monitor for Bahrain. Headline consumer price index, January 2010 (derived) to August 2026, April 2019 = 100; latest value 104.2.</desc>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .title { font-size: 56px; font-weight: 700; fill: #0b0b0b; letter-spacing: -1px; }
  .sub { font-size: 21px; fill: #52514e; }
  .small { font-size: 16px; fill: #898781; }
  .tick { font-size: 13px; fill: #898781; }
  .cap { font-size: 14px; fill: #52514e; font-weight: 600; }
  .val { font-size: 15px; fill: #0b0b0b; font-weight: 700; }
  .chip rect { fill: #ffffff; stroke: #dcdad3; }
  .chip text { font-size: 14px; fill: #52514e; font-weight: 600; }
  .line { fill: none; stroke: #2a78d6; stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round;
          stroke-dasharray: 1; animation: draw 3.2s cubic-bezier(.45,0,.2,1) .3s both; }
  .area { fill: url(#fade); animation: fadein 1.2s ease 3.1s both; }
  .dline { fill: none; stroke: #2a78d6; stroke-width: 2; stroke-dasharray: 3 4; opacity: .75;
           animation: fadein .6s ease .1s both; }
  .capnote { font-weight: 400; fill: #898781; }
  .dot { fill: #2a78d6; stroke: #f9f9f7; stroke-width: 2; }
  .pulse { fill: none; stroke: #2a78d6; stroke-width: 2; transform-box: fill-box; transform-origin: center;
           animation: pulse 2.8s ease-out 3.6s infinite both; }
  .end { animation: fadein .6s ease 3.5s both; }
  .glint { animation: glint 6s ease-in-out 1s infinite; }
  @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
  @keyframes pulse { 0% { transform: scale(1); opacity: .55; } 70%, 100% { transform: scale(3); opacity: 0; } }
  @keyframes glint { 0%, 80%, 100% { opacity: 0; } 88% { opacity: .9; } }
  @media (prefers-reduced-motion: reduce) {
    .line, .area, .end, .glint, .dline { animation: none; }
    .pulse { display: none; }
  }
</style>
<defs>
  <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#2a78d6" stop-opacity=".18"/>
    <stop offset="1" stop-color="#2a78d6" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect x="1" y="1" width="1198" height="318" rx="22" fill="#f9f9f7" stroke="#e6e4de" stroke-width="2"/>

<!-- mark: a lens over rising bars (original) -->
<g transform="translate(60 62)">
