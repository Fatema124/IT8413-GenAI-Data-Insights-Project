<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" width="1200" height="390" role="img" aria-labelledby="t d">
<title id="t">PriceLens BH</title>
<desc id="d">Bahrain cost-of-living monitor. Headline consumer price index for all households, January 2010 (derived) to August 2026, April 2019 = 100; latest value 104.2.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#13264a"/><stop offset="0.55" stop-color="#183763"/><stop offset="1" stop-color="#1f4f8f"/></linearGradient>
