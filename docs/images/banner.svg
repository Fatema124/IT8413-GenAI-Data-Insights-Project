  <clipPath id="round"><rect width="1200" height="390" rx="18"/></clipPath>
</defs>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; }
  .kick { font-size: 14px; font-weight: 700; letter-spacing: 3px; fill: #a9c6ee; }
  .title { font-size: 64px; font-weight: 700; fill: #ffffff; letter-spacing: -1.5px; }
  .sub { font-size: 20px; fill: #d9e2ef; }
  .qk { font-size: 12px; font-weight: 700; letter-spacing: 2px; fill: #c9a227; }
  .q { font-size: 19px; fill: #ffffff; font-style: italic; opacity: 0; }
  .chip rect { fill: #ffffff; fill-opacity: 0.07; stroke: #ffffff; stroke-opacity: 0.22; }
  .chip text { font-size: 14px; fill: #e1e8f2; }
  .chip .dot { fill: #c9a227; }
  .chip { animation: up .6s ease both; }
  .panel { fill: #ffffff; fill-opacity: 0.05; stroke: #ffffff; stroke-opacity: 0.14; }
  .pt { font-size: 13px; fill: #bccadd; } .pt tspan { fill: #ffffff; font-weight: 600; }
  .tick { font-size: 12px; fill: #a3b3c9; }
  .base { stroke: #ffffff; stroke-opacity: 0.35; stroke-dasharray: 4 5; }
  .bl { font-size: 11px; fill: #a3b3c9; }
  .line { fill: none; stroke: #8fbcf6; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round;
           stroke-dasharray: 1; }
  .der { fill: none; stroke: #8fbcf6; stroke-width: 2.2; stroke-dasharray: 1.5 5; stroke-linecap: round; animation: fade .5s ease .1s both; }

  .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.6s ease-out 4s 3 both; }
  .val { font-size: 15px; font-weight: 700; fill: #ffffff; } .valm { font-size: 12px; fill: #bccadd; }

  .intro { animation: up .7s ease both; }
  @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeout { from { opacity: 1; } to { opacity: 0; } }
  @keyframes up { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  @keyframes pulse { 0% { transform: scale(1); opacity: .6; } 70%, 100% { transform: scale(2.6); opacity: 0; } }
  @keyframes q0 { 0%, 0.00% { opacity: 0; transform: translateY(8px); } 3.00%, 21.00% { opacity: 1; transform: none; } 25.00%, 100% { opacity: 0; transform: translateY(-6px); } }.q0 { animation: q0 12.8s ease-in-out 1.2s infinite both; }
@keyframes q1 { 0%, 24.99% { opacity: 0; transform: translateY(8px); } 28.00%, 46.00% { opacity: 1; transform: none; } 50.00%, 100% { opacity: 0; transform: translateY(-6px); } }.q1 { animation: q1 12.8s ease-in-out 1.2s infinite both; }
@keyframes q2 { 0%, 49.99% { opacity: 0; transform: translateY(8px); } 53.00%, 71.00% { opacity: 1; transform: none; } 75.00%, 100% { opacity: 0; transform: translateY(-6px); } }.q2 { animation: q2 12.8s ease-in-out 1.2s infinite both; }
@keyframes q3 { 0%, 74.99% { opacity: 0; transform: translateY(8px); } 78.00%, 96.00% { opacity: 1; transform: none; } 100.00%, 100% { opacity: 0; transform: translateY(-6px); } }.q3 { animation: q3 12.8s ease-in-out 1.2s infinite both; }
  @media (prefers-reduced-motion: reduce) {
    .der, .chip, .intro { animation: none; } .lens, .pulse { display: none; }
    .q { animation: none; } .q0 { opacity: 1; }
  }
</style>
