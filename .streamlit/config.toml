# PriceLens BH - look and behaviour of the Streamlit app
[theme]
base = "light"
primaryColor = "#2a78d6"            # calm blue for buttons, sliders and selected filters
backgroundColor = "#f9f9f7"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
font = "sans serif"

[browser]
gatherUsageStats = false
